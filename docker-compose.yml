# Run everything: docker compose up --build
services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 8s
      timeout: 5s
      retries: 20
  config-server:
    build:
      context: .
      args:
        MODULE: config-server
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8888'"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: on-failure
  discovery-server:
    build:
      context: .
      args:
        MODULE: discovery-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8761'"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: on-failure
  api-gateway:
    build:
      context: .
      args:
        MODULE: api-gateway
    ports:
      - "8080:8080"
    environment:
      CONFIG_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    restart: on-failure
  book-service:
    build:
      context: .
      args:
        MODULE: book-service
    ports:
      - "8081:8081"
    environment:
      CONFIG_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    restart: on-failure
  member-service:
    build:
      context: .
      args:
        MODULE: member-service
    ports:
      - "8082:8082"
    environment:
      CONFIG_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    restart: on-failure
  lending-service:
    build:
      context: .
      args:
        MODULE: lending-service
    ports:
      - "8083:8083"
    environment:
      CONFIG_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure
  fine-service:
    build:
      context: .
      args:
        MODULE: fine-service
    ports:
      - "8084:8084"
    environment:
      CONFIG_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure
  notification-service:
    build:
      context: .
      args:
        MODULE: notification-service
    ports:
      - "8085:8085"
    environment:
      CONFIG_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    restart: on-failure
