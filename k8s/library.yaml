apiVersion: v1
kind: Namespace
metadata:
  name: library
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: library
spec:
  replicas: 1
  selector:
    matchLabels: {app: rabbitmq}
  template:
    metadata:
      labels: {app: rabbitmq}
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3.13-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5672
        readinessProbe:
          tcpSocket: {port: 5672}
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: library
spec:
  selector:
    app: rabbitmq
  ports:
  - port: 5672
    targetPort: 5672
---
