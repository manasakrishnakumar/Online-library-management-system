      labels: {app: api-gateway}
    spec:
      containers:
      - name: api-gateway
        image: library/api-gateway:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - {name: CONFIG_URL, value: "http://config-server:8888"}
        - {name: EUREKA_URL, value: "http://discovery-server:8761/eureka"}
        - {name: ZIPKIN_URL, value: "http://zipkin:9411/api/v2/spans"}
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef: {name: library-secrets, key: jwt-secret}
        readinessProbe:
          tcpSocket: {port: 8080}
          initialDelaySeconds: 30
          periodSeconds: 10
