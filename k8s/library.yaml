apiVersion: v1
kind: Namespace
metadata:
  name: library
---
apiVersion: v1
kind: Secret
metadata:
  name: library-secrets
  namespace: library
type: Opaque
stringData:
  jwt-secret: library-demo-secret-library-demo-secret-2026   # demo value: replace before real use
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: library
data:
  init.sql: |
    -- One database and one login per microservice (database-per-service).
    -- Demo credentials only; real deployments would inject secrets.
    CREATE USER bookuser PASSWORD 'book123';
    CREATE DATABASE bookdb OWNER bookuser;
    CREATE USER memberuser PASSWORD 'member123';
    CREATE DATABASE memberdb OWNER memberuser;
    CREATE USER lendinguser PASSWORD 'lending123';
    CREATE DATABASE lendingdb OWNER lendinguser;
    CREATE USER fineuser PASSWORD 'fine123';
    CREATE DATABASE finedb OWNER fineuser;
    CREATE USER notificationuser PASSWORD 'notification123';
    CREATE DATABASE notificationdb OWNER notificationuser;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: library
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5432
        env:
        - {name: POSTGRES_PASSWORD, value: "postgres"}
        volumeMounts:
        - {name: init, mountPath: /docker-entrypoint-initdb.d}
        - {name: data, mountPath: /var/lib/postgresql/data}
        readinessProbe:
          tcpSocket: {port: 5432}
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: init
        configMap: {name: postgres-init}
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: library
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: library
spec:
  replicas: 1
  selector:
    matchLabels: {app: rabbitmq}
  template:
    metadata:
      labels: {app: rabbitmq}
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3.13-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5672
        readinessProbe:
          tcpSocket: {port: 5672}
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
