---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: library
spec:
  replicas: 1
  selector:
    matchLabels: {app: api-gateway}
  template:
    metadata:
      labels: {app: api-gateway}
    spec:
      containers:
      - name: api-gateway
        image: library/api-gateway:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - {name: CONFIG_URL, value: "http://config-server:8888"}
        - {name: EUREKA_URL, value: "http://discovery-server:8761/eureka"}
        readinessProbe:
          tcpSocket: {port: 8080}
          initialDelaySeconds: 30
          periodSeconds: 10
---
