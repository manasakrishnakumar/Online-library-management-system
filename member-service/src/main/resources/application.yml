server:
  error:
    include-message: always
  port: 8082
spring:
  application:
    name: member-service
  config:
    import: "optional:configserver:${CONFIG_URL:http://localhost:8888}"
  cloud:
    config:
      fail-fast: false
  datasource:
    url: jdbc:h2:mem:memberdb;DB_CLOSE_DELAY=-1
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: false
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
