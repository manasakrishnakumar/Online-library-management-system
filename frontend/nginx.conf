server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api-gateway:8080;
    proxy_set_header Host $host;
  }
  location /gateway-health {
    proxy_pass http://api-gateway:8080/actuator/health;
  }
  location / {
    try_files $uri /index.html;
  }
}
