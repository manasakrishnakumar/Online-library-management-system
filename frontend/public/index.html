<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Online Library Management System</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><span class="logo">&#128216;</span><div><strong>Online Library</strong><small>Management System</small></div></div>
    <nav id="nav"></nav>
    <div class="foot">Microservices &middot; IS373TA</div>
  </aside>
  <div class="main">
    <header class="top">
      <button id="menu" class="icon" aria-label="Menu">&#9776;</button>
      <h1 id="title"></h1>
      <div id="who" class="who"></div>
    </header>
    <main id="view"></main>
  </div>
</div>
<div id="login" class="modal loginwrap" hidden>
  <form class="sheet" id="loginForm">
    <h2>Sign in</h2>
    <label>Username<input name="username" autocomplete="username" required></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <div id="loginErr" class="loginerr"></div>
    <div class="row"><button class="b p">Sign in</button></div>
    <p class="hint">Demo accounts: <b>librarian</b> / librarian123 (full access), or <b>asha.rao@example.com</b> / member123 (member view).</p>
  </form>
</div>
<div id="modal" class="modal" hidden><div class="sheet" id="sheet"></div></div>
<div id="toasts"></div>
<script src="app.js"></script>
</body>
</html>
