server:
  error:
    include-message: always
  port: 8084
spring:
  application:
    name: fine-service
  config:
    import: "optional:configserver:${CONFIG_URL:http://localhost:8888}"
  cloud:
    config:
      fail-fast: false
  datasource:
    url: jdbc:h2:mem:finedb;DB_CLOSE_DELAY=-1
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: false
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
library:
  fine-per-day: 2.0
resilience4j:
  circuitbreaker:
    instances:
      lendingService:
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
