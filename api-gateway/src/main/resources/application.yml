server:
  port: 8080
spring:
  application:
    name: api-gateway
  config:
    import: "optional:configserver:${CONFIG_URL:http://localhost:8888}"
  cloud:
    config:
      fail-fast: false
    gateway:
      routes:
        - id: book-service
          uri: lb://book-service
          predicates:
            - Path=/api/books/**
        - id: member-service
          uri: lb://member-service
          predicates:
            - Path=/api/members/**
        - id: lending-service
          uri: lb://lending-service
          predicates:
            - Path=/api/loans/**
        - id: fine-service
          uri: lb://fine-service
          predicates:
            - Path=/api/fines/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
