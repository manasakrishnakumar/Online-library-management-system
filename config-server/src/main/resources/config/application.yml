# Shared configuration served to every microservice by the Config Server
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers
library:
  loan-period-days: 14
  fine-per-day: 2.0
